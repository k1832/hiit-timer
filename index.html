<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIIT Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
        body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        @keyframes fade-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(1.3); opacity: 0; } }
        @keyframes flash-bg { 0% { opacity: 0.5; } 100% { opacity: 0; } }
        @keyframes count-pop { 0% { transform: scale(1.15); } 100% { transform: scale(1); } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes check-draw { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
        @keyframes circle-draw { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }

        .fade-in { animation: fade-in 0.4s ease-out both; }
        .slide-up { animation: slide-up 0.5s ease-out both; }
        .count-pop { animation: count-pop 0.2s ease-out; }

        /* Circular progress */
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring__bg { stroke: rgba(255,255,255,0.08); }
        .progress-ring__fill { transition: stroke-dashoffset 0.3s linear; stroke-linecap: round; }

        /* Number input stepper style */
        .stepper { display: flex; align-items: center; gap: 0; }
        .stepper button {
            width: 56px; height: 56px; border: none; font-size: 28px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; transition: background 0.15s;
            -webkit-user-select: none; user-select: none;
        }
        .stepper button:first-child { background: rgba(255,255,255,0.1); border-radius: 16px 0 0 16px; }
        .stepper button:last-child { background: rgba(255,255,255,0.1); border-radius: 0 16px 16px 0; }
        .stepper button:active { background: rgba(255,255,255,0.25); }
        .stepper .stepper-value {
            width: 72px; height: 56px; background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 700; color: white;
            border-top: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ========== SETUP SCREEN ==========
        const Stepper = ({ value, onChange, min = 1, max = 99, suffix = '', step = 1 }) => (
            <div className="stepper">
                <button onClick={() => onChange(Math.max(min, value - step))}>−</button>
                <div className="stepper-value">{value}{suffix}</div>
                <button onClick={() => onChange(Math.min(max, value + step))}>+</button>
            </div>
        );

        const SetupScreen = ({ onStart }) => {
            const [warmupSec, setWarmupSec] = useState(120);
            const [sets, setSets] = useState(8);
            const [sprintSec, setSprintSec] = useState(20);
            const [restSec, setRestSec] = useState(35);

            return (
                <div className="fixed inset-0 bg-[#0a0a0a] text-white flex flex-col items-center justify-center p-6">
                    <div className="w-full max-w-sm flex flex-col items-center gap-6 fade-in" style={{maxHeight: '100dvh'}}>
                        {/* Title */}
                        <div className="text-center shrink-0">
                            <h1 className="text-3xl font-black tracking-tight">HIIT TIMER</h1>
                        </div>

                        {/* Settings */}
                        <div className="w-full space-y-5 shrink-0">
                            <div className="flex items-center justify-between">
                                <label className="text-base font-medium text-gray-300">ウォームアップ</label>
                                <Stepper value={warmupSec} onChange={setWarmupSec} min={0} max={600} suffix="s" step={10} />
                            </div>
                            <div className="flex items-center justify-between">
                                <label className="text-base font-medium text-gray-300">セット数</label>
                                <Stepper value={sets} onChange={setSets} min={1} max={50} />
                            </div>
                            <div className="flex items-center justify-between">
                                <label className="text-base font-medium text-gray-300">スプリント</label>
                                <Stepper value={sprintSec} onChange={setSprintSec} min={5} max={120} suffix="s" />
                            </div>
                            <div className="flex items-center justify-between">
                                <label className="text-base font-medium text-gray-300">休憩</label>
                                <Stepper value={restSec} onChange={setRestSec} min={5} max={120} suffix="s" />
                            </div>
                        </div>

                        {/* Total time */}
                        <div className="text-center text-sm text-gray-500 shrink-0">
                            合計: {Math.floor((warmupSec + (sprintSec + restSec) * sets) / 60)}分{(warmupSec + (sprintSec + restSec) * sets) % 60}秒
                        </div>

                        {/* Start button */}
                        <button
                            onClick={() => onStart({ sets, sprintSec, restSec, warmupSec })}
                            className="w-full py-5 rounded-2xl bg-emerald-500 text-white text-xl font-bold
                                       active:scale-[0.97] transition-transform shrink-0"
                        >
                            START
                        </button>
                    </div>
                </div>
            );
        };

        // ========== TIMER SCREEN ==========
        const TimerScreen = ({ config, onBack }) => {
            const { sets, sprintSec, restSec, warmupSec } = config;

            // phase: 'ready' | 'warmup' | 'sprint' | 'rest' | 'done'
            const [phase, setPhase] = useState('ready');
            const [currentSet, setCurrentSet] = useState(1);
            const [timeLeft, setTimeLeft] = useState(3); // 3-sec countdown to start
            const [isRunning, setIsRunning] = useState(true);
            const [totalElapsed, setTotalElapsed] = useState(0);
            const [flashKey, setFlashKey] = useState(0);
            const timerRef = useRef(null);
            const popRef = useRef(null);

            const phaseDuration = phase === 'ready' ? 3 : phase === 'warmup' ? warmupSec : phase === 'sprint' ? sprintSec : restSec;
            const progress = phaseDuration > 0 ? (phaseDuration - timeLeft) / phaseDuration : 1;

            // Ring geometry
            const radius = 120;
            const circumference = 2 * Math.PI * radius;
            const dashOffset = circumference * (1 - progress);

            const formatTime = (s) => `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;

            // Advance phase
            const nextPhase = useCallback(() => {
                setFlashKey(k => k + 1);
                if (phase === 'ready') {
                    if (warmupSec > 0) {
                        setPhase('warmup');
                        setTimeLeft(warmupSec);
                    } else {
                        setPhase('sprint');
                        setTimeLeft(sprintSec);
                    }
                } else if (phase === 'warmup') {
                    setPhase('sprint');
                    setTimeLeft(sprintSec);
                } else if (phase === 'sprint') {
                    setPhase('rest');
                    setTimeLeft(restSec);
                } else if (phase === 'rest') {
                    if (currentSet < sets) {
                        setCurrentSet(c => c + 1);
                        setPhase('sprint');
                        setTimeLeft(sprintSec);
                    } else {
                        setPhase('done');
                        setIsRunning(false);
                    }
                }
            }, [phase, currentSet, sets, sprintSec, restSec, warmupSec]);

            // Timer tick
            useEffect(() => {
                if (!isRunning || phase === 'done') {
                    clearInterval(timerRef.current);
                    return;
                }
                timerRef.current = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            nextPhase();
                            return 0;
                        }
                        return prev - 1;
                    });
                    if (phase !== 'ready') setTotalElapsed(t => t + 1);
                }, 1000);
                return () => clearInterval(timerRef.current);
            }, [isRunning, phase, nextPhase]);

            // Pop animation on timeLeft change
            useEffect(() => {
                if (popRef.current) {
                    popRef.current.classList.remove('count-pop');
                    void popRef.current.offsetWidth;
                    popRef.current.classList.add('count-pop');
                }
            }, [timeLeft]);

            const togglePause = () => {
                if (phase === 'done') return;
                setIsRunning(r => !r);
            };

            const phaseColors = {
                ready: { bg: 'from-gray-900 to-gray-800', ring: '#6b7280', text: 'READY' },
                warmup: { bg: 'from-yellow-900/80 to-amber-900/60', ring: '#f59e0b', text: 'WARM UP' },
                sprint: { bg: 'from-red-900/80 to-orange-900/60', ring: '#ef4444', text: 'SPRINT' },
                rest: { bg: 'from-blue-900/80 to-cyan-900/60', ring: '#3b82f6', text: 'REST' },
                done: { bg: 'from-gray-900 to-gray-800', ring: '#10b981', text: '' },
            };
            const c = phaseColors[phase];

            if (phase === 'done') {
                return (
                    <div className="fixed inset-0 bg-[#0a0a0a] text-white flex flex-col items-center justify-center p-6">
                        <div className="text-center slide-up space-y-6">
                            <svg width="100" height="100" viewBox="0 0 100 100" className="mx-auto">
                                <circle cx="50" cy="50" r="38" fill="none" stroke="#10b981" strokeWidth="4"
                                    strokeDasharray="220" style={{animation: 'circle-draw 0.6s ease-out forwards'}} />
                                <path d="M30 52 L44 66 L70 36" fill="none" stroke="#10b981" strokeWidth="5"
                                    strokeLinecap="round" strokeLinejoin="round"
                                    strokeDasharray="48" style={{animation: 'check-draw 0.4s ease-out 0.4s forwards', strokeDashoffset: 48}} />
                            </svg>
                            <div>
                                <h2 className="text-4xl font-black">COMPLETE!</h2>
                                <p className="text-lg text-gray-400 mt-2">{sets}セット / {formatTime(totalElapsed)}</p>
                            </div>
                            <div className="flex gap-4 justify-center mt-8">
                                <button onClick={onBack}
                                    className="px-8 py-4 rounded-2xl bg-white/10 text-white text-lg font-bold
                                               active:scale-[0.97] transition-transform">
                                    戻る
                                </button>
                                <button onClick={() => {
                                        setPhase('ready');
                                        setCurrentSet(1);
                                        setTimeLeft(3);
                                        setTotalElapsed(0);
                                        setIsRunning(true);
                                    }}
                                    className="px-8 py-4 rounded-2xl bg-emerald-500 text-white text-lg font-bold
                                               active:scale-[0.97] transition-transform">
                                    もう1回
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`fixed inset-0 bg-gradient-to-b ${c.bg} text-white flex transition-all duration-700`}>
                    {/* Flash overlay on phase change */}
                    <div key={flashKey} className="fixed inset-0 bg-white pointer-events-none"
                         style={{animation: 'flash-bg 0.4s ease-out forwards'}} />

                    {/* Layout: responsive for portrait & landscape */}
                    <div className="w-full h-full flex flex-col landscape:flex-row items-center justify-evenly p-4 gap-2">

                        {/* Top / Left: phase label + set info */}
                        <div className="flex flex-col items-center gap-1 shrink-0 fade-in">
                            <span className="text-sm font-bold tracking-[0.3em] uppercase opacity-60">{c.text}</span>
                            {phase !== 'ready' && phase !== 'warmup' && (
                                <>
                                    <div className="flex items-center gap-2">
                                        {Array.from({ length: sets }, (_, i) => (
                                            <div key={i} className={`w-2.5 h-2.5 rounded-full transition-all duration-300 ${
                                                i < currentSet - 1 ? 'bg-white/80 scale-75' :
                                                i === currentSet - 1 ? 'bg-white scale-110' :
                                                'bg-white/20'
                                            }`} />
                                        ))}
                                    </div>
                                    <span className="text-xs text-white/40 mt-0.5">{currentSet} / {sets}</span>
                                </>
                            )}
                        </div>

                        {/* Center: circular timer */}
                        <div className="relative flex items-center justify-center shrink-0" onClick={togglePause}>
                            <svg className="progress-ring" viewBox="0 0 260 260"
                                 style={{width: 'min(60vw, 55vh)', height: 'min(60vw, 55vh)'}}>
                                <circle className="progress-ring__bg" cx="130" cy="130" r={radius}
                                    fill="none" strokeWidth="8" />
                                <circle className="progress-ring__fill" cx="130" cy="130" r={radius}
                                    fill="none" strokeWidth="8" stroke={c.ring}
                                    strokeDasharray={circumference} strokeDashoffset={dashOffset} />
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                                <div ref={popRef} className="font-black tabular-nums leading-none"
                                     style={{fontSize: phase === 'warmup' ? 'min(16vw, 14vh)' : 'min(20vw, 18vh)'}}>
                                    {phase === 'warmup' ? formatTime(timeLeft) : timeLeft}
                                </div>
                                {!isRunning && phase !== 'done' && (
                                    <div className="text-sm font-bold tracking-widest opacity-60 mt-2">PAUSED</div>
                                )}
                            </div>
                        </div>

                        {/* Bottom / Right: next up + controls */}
                        <div className="flex flex-col items-center gap-3 shrink-0">
                            {/* Next up label */}
                            {phase === 'warmup' ? (
                                <div className="text-center opacity-50 text-sm">
                                    <span className="uppercase tracking-wider text-xs font-bold">Next</span>
                                    <div className="font-bold">SPRINT {sprintSec}s</div>
                                </div>
                            ) : phase === 'sprint' ? (
                                <div className="text-center opacity-50 text-sm">
                                    <span className="uppercase tracking-wider text-xs font-bold">Next</span>
                                    <div className="font-bold">REST {restSec}s</div>
                                </div>
                            ) : phase === 'rest' ? (
                                currentSet < sets ? (
                                    <div className="text-center opacity-50 text-sm">
                                        <span className="uppercase tracking-wider text-xs font-bold">Next</span>
                                        <div className="font-bold">SPRINT {sprintSec}s</div>
                                    </div>
                                ) : (
                                    <div className="text-center opacity-50 text-sm">
                                        <span className="uppercase tracking-wider text-xs font-bold">Last set!</span>
                                    </div>
                                )
                            ) : phase === 'ready' ? (
                                warmupSec > 0 ? (
                                    <div className="text-center opacity-50 text-sm">
                                        <span className="uppercase tracking-wider text-xs font-bold">Next</span>
                                        <div className="font-bold">WARM UP {formatTime(warmupSec)}</div>
                                    </div>
                                ) : (
                                    <div className="text-center opacity-50 text-sm">
                                        <span className="uppercase tracking-wider text-xs font-bold">Next</span>
                                        <div className="font-bold">SPRINT {sprintSec}s</div>
                                    </div>
                                )
                            ) : (
                                <div className="text-center opacity-50 text-sm h-10" />
                            )}

                            {/* Pause / Resume button */}
                            <button onClick={togglePause}
                                className={`w-16 h-16 rounded-full flex items-center justify-center transition-all active:scale-90 ${
                                    isRunning ? 'bg-white/15' : 'bg-white/25'
                                }`}>
                                {isRunning ? (
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                                    </svg>
                                ) : (
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                                        <polygon points="8 4 20 12 8 20"/>
                                    </svg>
                                )}
                            </button>

                            {/* Back button */}
                            <button onClick={onBack}
                                className="text-xs text-white/30 underline underline-offset-2">
                                やめる
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ========== APP ==========
        const App = () => {
            const [screen, setScreen] = useState('setup'); // 'setup' | 'timer'
            const [config, setConfig] = useState(null);

            const handleStart = (cfg) => {
                setConfig(cfg);
                setScreen('timer');
            };

            if (screen === 'timer' && config) {
                return <TimerScreen config={config} onBack={() => setScreen('setup')} />;
            }
            return <SetupScreen onStart={handleStart} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
